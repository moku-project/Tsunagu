services:
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    environment:
      SANDBOX_PORT: 50051
      SANDBOX_EXTENSIONS_DIR: /data/extensions
      SANDBOX_ENABLE_NOVEL: "false"
    volumes:
      - tsunagu-extensions:/data/extensions
    expose:
      - "50051"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TSUNAGU_ADDR: ":8080"
      TSUNAGU_DB_PATH: "/data/tsunagu.db"
      TSUNAGU_JAR_CACHE_DIR: "/data/jar-cache"
      TSUNAGU_SANDBOX_ADDR: "sandbox:50051"
    ports:
      - "8080:8080"
    volumes:
      - tsunagu-db:/data
    depends_on:
      - sandbox

volumes:
  tsunagu-db:
  tsunagu-extensions:
