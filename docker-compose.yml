services:
  tsunagu:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "6007:6007"
    volumes:
      - tsunagu-data:/app/data
      - tsunagu-jar-cache:/app/jar-cache
      - tsunagu-extensions:/app/sandbox/extensions
      - ./tsunagu.toml:/app/tsunagu.toml:ro
    security_opt:
      - no-new-privileges:true
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true

volumes:
  tsunagu-data:
  tsunagu-jar-cache:
  tsunagu-extensions:
