syntax = "proto3";

package sandbox.v1;

option go_package = "tsunagu/backend/internal/sandbox/gen;sandboxv1";

service ExtensionService {
  rpc AddRepository(AddRepositoryRequest) returns (Repository);
  rpc ListRepositories(Empty) returns (RepositoryList);
  rpc ListAvailableExtensions(ListAvailableExtensionsRequest) returns (ExtensionList);
  rpc InstallExtension(InstallExtensionRequest) returns (Extension);
  rpc ListInstalledExtensions(Empty) returns (ExtensionList);
  rpc UninstallExtension(ExtensionRequest) returns (Empty);

  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetDetails(EntryRequest) returns (EntryDetails);
  rpc GetChapters(EntryRequest) returns (ChapterList);

  rpc GetPages(ChapterRequest) returns (PageList);
  rpc GetChapterText(ChapterRequest) returns (TextContent);
  rpc GetVideoStream(EpisodeRequest) returns (StreamInfo);
}

enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  MANGA = 1;
  NOVEL = 2;
  ANIME = 3;
}

message Empty {}

message AddRepositoryRequest {
  string index_url = 1;
}

message Repository {
  string id = 1;
  string index_url = 2;
  string name = 3;
}

message RepositoryList {
  repeated Repository repositories = 1;
}

message ListAvailableExtensionsRequest {
  string repository_id = 1;
}

message InstallExtensionRequest {
  string repository_id = 1;
  string extension_id = 2;
}

message ExtensionRequest {
  string extension_id = 1;
}

message Extension {
  string id = 1;
  string name = 2;
  string version = 3;
  ContentType content_type = 4;
  string lang = 5;
}

message ExtensionList {
  repeated Extension extensions = 1;
}

message SearchRequest {
  string extension_id = 1;
  string query = 2;
  int32 page = 3;
}

message SearchResponse {
  repeated EntrySummary results = 1;
  bool has_next_page = 2;
}

message EntrySummary {
  string source_entry_id = 1;
  string title = 2;
  string cover_url = 3;
}

message EntryRequest {
  string extension_id = 1;
  string source_entry_id = 2;
}

message EntryDetails {
  string source_entry_id = 1;
  string title = 2;
  string description = 3;
  string cover_url = 4;
  repeated string authors = 5;
  repeated string genres = 6;
  string status = 7;
}

message ChapterList {
  repeated ChapterSummary chapters = 1;
}

message ChapterSummary {
  string source_chapter_id = 1;
  string name = 2;
  double number = 3;
  int64 upload_timestamp = 4;
}

message ChapterRequest {
  string extension_id = 1;
  string source_entry_id = 2;
  string source_chapter_id = 3;
}

message PageList {
  repeated string page_urls = 1;
}

message TextContent {
  string content = 1;
  string format = 2;
}

message EpisodeRequest {
  string extension_id = 1;
  string source_entry_id = 2;
  string source_episode_id = 3;
}

message StreamInfo {
  string stream_url = 1;
  string quality = 2;
  repeated SubtitleTrack subtitles = 3;
}

message SubtitleTrack {
  string url = 1;
  string lang = 2;
}
