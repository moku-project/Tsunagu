name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (no leading v), e.g. 0.1.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: build tsunagu (all targets)
        run: |
          VER="${{ inputs.version }}"
          BT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p out
          nix develop -c bash -c "
            cd backend
            for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
              os=\${t%/*}; arch=\${t#*/}
              ext=''; [ \$os = windows ] && ext='.exe'
              GOOS=\$os GOARCH=\$arch CGO_ENABLED=0 go build \
                -trimpath -ldflags \"-s -w -X main.serverVersion=$VER -X main.serverBuildTime=$BT\" \
                -o ../out/tsunagu-\$os-\$arch\$ext ./cmd/server
            done
          "
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: out/* }

  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Maven Central rate-limits fresh runners (429), so keep downloads between runs and back off on retries.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('sandbox/*.gradle.kts') }}
          restore-keys: gradle-
      - name: shadow jar
        run: |
          nix develop -c bash -c 'cd sandbox && gradle shadowJar -x test --no-daemon -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=2000'
          mkdir -p out && cp sandbox/build/libs/*-all.jar out/sandbox.jar
      - uses: actions/upload-artifact@v4
        with: { name: jar, path: out/sandbox.jar }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: mobile/go.sum }
      - name: gomobile bind
        run: |
          set -eu
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p out bin
          cd mobile
          go build -o ../bin/gobind golang.org/x/mobile/cmd/gobind
          PATH="$PWD/../bin:$PATH" go tool gomobile bind \
            -target=android/arm64,android/amd64 \
            -androidapi 26 \
            -javapkg dev.moku.tsunagu \
            -ldflags "-s -w -X tsunagu/backend/embedded.Version=${{ inputs.version }}" \
            -o ../out/tsunagu-android.aar \
            tsunagu/backend/embedded
          cp ../proto/sandbox/v1/sandbox.proto ../out/sandbox.proto
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: mobile/go.sum }
      - name: gomobile bind
        run: |
          set -eu
          mkdir -p out bin
          cd mobile
          go build -o ../bin/gobind golang.org/x/mobile/cmd/gobind
          # macos/arm64 lets the app's tests and SwiftUI previews run on the Mac.
          PATH="$PWD/../bin:$PATH" go tool gomobile bind \
            -target=ios/arm64,iossimulator/arm64,macos/arm64 \
            -iosversion=18.0 \
            -ldflags "-s -w -X tsunagu/backend/embedded.Version=${{ inputs.version }}" \
            -o ../out/Tsunagu.xcframework \
            tsunagu/backend/embedded
          cd ../out
          ditto -c -k --sequesterRsrc --keepParent Tsunagu.xcframework tsunagu-ios.xcframework.zip
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/tsunagu-ios.xcframework.zip }

  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-amd64  }
          - { os: ubuntu-24.04-arm, name: linux-arm64  }
          - { os: macos-15-intel,   name: darwin-amd64 }
          - { os: macos-15,         name: darwin-arm64 }
          - { os: windows-latest,   name: windows-amd64 }
          - { os: windows-11-arm,   name: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: jlink minimal runtime
        shell: bash
        run: |
          MODS="$(cat sandbox/build-config/jlink-modules.txt)"
          "$JAVA_HOME/bin/jlink" --add-modules "$MODS" \
            --strip-debug --no-header-files --no-man-pages \
            --output runtime
          runtime/bin/java -version
          test -f runtime/lib/modules
          for m in $(echo "$MODS" | tr ',' ' '); do
            runtime/bin/java --list-modules | grep -q "^$m@" || { echo "missing module: $m"; exit 1; }
          done
      - name: package
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            if command -v 7z >/dev/null; then
              7z a -tzip "out/runtime-${{ matrix.name }}.zip" runtime
            else
              pwsh -NoProfile -Command "Compress-Archive -Path runtime -DestinationPath out/runtime-${{ matrix.name }}.zip"
            fi
          else
            tar czf "out/runtime-${{ matrix.name }}.tar.gz" runtime
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.name }}
          path: out/*

  docker:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest,   suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/tsunagu,push-by-digest=true,name-canonical=true,push=true
      - name: export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*

  docker-manifest:
    needs: docker
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: digest-amd64, path: digests }
      - uses: actions/download-artifact@v4
        with: { name: digest-arm64, path: digests }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create multi-arch tags
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/tsunagu"
          docker buildx imagetools create \
            -t "$IMG:${{ inputs.version }}" -t "$IMG:latest" \
            "$IMG@$(cat digests/amd64)" "$IMG@$(cat digests/arm64)"

  publish:
    needs: [binaries, jar, android, ios, runtime, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: binaries, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: jar, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: android, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: ios, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-linux-amd64, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-linux-arm64, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-darwin-amd64, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-darwin-arm64, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-windows-amd64, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-windows-arm64, path: dl }
      - name: assemble bundles + checksums + manifest
        run: |
          set -eu
          mkdir rel
          cp dl/tsunagu-* rel/
          cp dl/sandbox.jar rel/
          cp dl/tsunagu-android.aar dl/sandbox.proto rel/
          cp dl/runtime-* rel/
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            case "$t" in
              windows-*) bin=tsunagu-$t.exe;  ext=.exe; arc="rel/runtime-$t.zip" ;;
              *)         bin=tsunagu-$t;      ext="";   arc="rel/runtime-$t.tar.gz" ;;
            esac
            root="tsunagu-$t"
            mkdir -p "$root/sandbox"
            cp "dl/$bin" "$root/tsunagu$ext"
            chmod +x "$root/tsunagu$ext"
            cp dl/sandbox.jar "$root/sandbox/sandbox.jar"
            case "$arc" in
              *.zip) unzip -q "$arc" -d "$root/sandbox/" ;;
              *)     tar xzf "$arc" -C "$root/sandbox/" ;;
            esac
            if [ "${t%-*}" = windows ]; then
              zip -qr "rel/$root.zip" "$root"
            else
              tar czf "rel/$root.tar.gz" "$root"
            fi
            rm -rf "$root"
          done
          cd rel
          sha256sum -- tsunagu-* sandbox.jar sandbox.proto runtime-* > sha256sums.txt
          VER="${{ inputs.version }}"
          IMG="ghcr.io/${{ github.repository_owner }}/tsunagu"
          {
            echo "{"
            echo "  \"version\": \"$VER\","
            echo "  \"image\": \"$IMG:$VER\","
            echo "  \"jar\": \"sandbox.jar\","
            echo "  \"android\": { \"aar\": \"tsunagu-android.aar\", \"proto\": \"sandbox.proto\" },"
            echo "  \"ios\": { \"xcframework\": \"tsunagu-ios.xcframework.zip\", \"jar\": \"sandbox.jar\", \"proto\": \"sandbox.proto\" },"
            echo "  \"binaries\": {"
            echo "    \"windows-amd64\": \"tsunagu-windows-amd64.exe\","
            echo "    \"windows-arm64\": \"tsunagu-windows-arm64.exe\","
            echo "    \"darwin-amd64\": \"tsunagu-darwin-amd64\","
            echo "    \"darwin-arm64\": \"tsunagu-darwin-arm64\","
            echo "    \"linux-amd64\": \"tsunagu-linux-amd64\","
            echo "    \"linux-arm64\": \"tsunagu-linux-arm64\""
            echo "  },"
            echo "  \"runtimes\": {"
            echo "    \"windows-amd64\": \"runtime-windows-amd64.zip\","
            echo "    \"windows-arm64\": \"runtime-windows-arm64.zip\","
            echo "    \"darwin-amd64\": \"runtime-darwin-amd64.tar.gz\","
            echo "    \"darwin-arm64\": \"runtime-darwin-arm64.tar.gz\","
            echo "    \"linux-amd64\": \"runtime-linux-amd64.tar.gz\","
            echo "    \"linux-arm64\": \"runtime-linux-arm64.tar.gz\""
            echo "  },"
            echo "  \"bundles\": {"
            echo "    \"windows-amd64\": \"tsunagu-windows-amd64.zip\","
            echo "    \"windows-arm64\": \"tsunagu-windows-arm64.zip\","
            echo "    \"darwin-amd64\": \"tsunagu-darwin-amd64.tar.gz\","
            echo "    \"darwin-arm64\": \"tsunagu-darwin-arm64.tar.gz\","
            echo "    \"linux-amd64\": \"tsunagu-linux-amd64.tar.gz\","
            echo "    \"linux-arm64\": \"tsunagu-linux-arm64.tar.gz\""
            echo "  }"
            echo "}"
          } > manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Tsunagu v${{ inputs.version }}
          files: rel/*
          generate_release_notes: true
