name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (no leading v), e.g. 0.1.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: build tsunagu (all targets)
        run: |
          VER="${{ inputs.version }}"
          BT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p out
          nix develop -c bash -c "
            cd backend
            for t in windows/amd64 darwin/amd64 darwin/arm64 linux/amd64; do
              os=\${t%/*}; arch=\${t#*/}
              ext=''; [ \$os = windows ] && ext='.exe'
              GOOS=\$os GOARCH=\$arch CGO_ENABLED=0 go build \
                -trimpath -ldflags \"-s -w -X main.serverVersion=$VER -X main.serverBuildTime=$BT\" \
                -o ../out/tsunagu-\$os-\$arch\$ext ./cmd/server
            done
          "
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: out/* }

  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: shadow jar
        run: |
          nix develop -c bash -c 'cd sandbox && gradle shadowJar -x test --no-daemon'
          mkdir -p out && cp sandbox/build/libs/*-all.jar out/sandbox.jar
      - uses: actions/upload-artifact@v4
        with: { name: jar, path: out/sandbox.jar }

  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-amd64  }
          - { os: macos-15-intel,   name: darwin-amd64 }
          - { os: macos-14,         name: darwin-arm64 }
          - { os: windows-latest,   name: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: jlink minimal runtime
        shell: bash
        run: |
          MODS="$(cat sandbox/build-config/jlink-modules.txt)"
          "$JAVA_HOME/bin/jlink" --add-modules "$MODS" \
            --strip-debug --no-header-files --no-man-pages --compress=zip-9 \
            --output runtime
          runtime/bin/java -version
      - name: package
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "out/runtime-${{ matrix.name }}.zip" runtime
          else
            tar czf "out/runtime-${{ matrix.name }}.tar.gz" runtime
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.name }}
          path: out/*

  docker:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest,   suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tsunagu:${{ inputs.version }}-${{ matrix.suffix }}

  docker-manifest:
    needs: docker
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: merge multi-arch manifest
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/tsunagu"
          for tag in "${{ inputs.version }}" latest; do
            docker buildx imagetools create -t "$IMG:$tag" \
              "$IMG:${{ inputs.version }}-amd64" \
              "$IMG:${{ inputs.version }}-arm64"
          done

  publish:
    needs: [binaries, jar, runtime, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: binaries, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: jar, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-linux-amd64, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-darwin-amd64, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-darwin-arm64, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: runtime-windows-amd64, path: dl }
      - name: assemble bundles + checksums + manifest
        run: |
          set -eu
          mkdir rel
          cp dl/tsunagu-* rel/
          cp dl/sandbox.jar rel/
          cp dl/runtime-* rel/
          for t in linux-amd64 darwin-amd64 darwin-arm64 windows-amd64; do
            case "$t" in
              windows-amd64) bin=tsunagu-windows-amd64.exe; ext=.exe; arc="rel/runtime-$t.zip" ;;
              *)             bin=tsunagu-$t;                 ext="";   arc="rel/runtime-$t.tar.gz" ;;
            esac
            root="tsunagu-$t"
            mkdir -p "$root/sandbox"
            cp "dl/$bin" "$root/tsunagu$ext"
            chmod +x "$root/tsunagu$ext"
            cp dl/sandbox.jar "$root/sandbox/sandbox.jar"
            case "$arc" in
              *.zip) unzip -q "$arc" -d "$root/sandbox/" ;;
              *)     tar xzf "$arc" -C "$root/sandbox/" ;;
            esac
            if [ "$t" = windows-amd64 ]; then
              zip -qr "rel/$root.zip" "$root"
            else
              tar czf "rel/$root.tar.gz" "$root"
            fi
            rm -rf "$root"
          done
          cd rel
          sha256sum -- tsunagu-* sandbox.jar runtime-* > sha256sums.txt
          VER="${{ inputs.version }}"
          IMG="ghcr.io/${{ github.repository_owner }}/tsunagu"
          {
            echo "{"
            echo "  \"version\": \"$VER\","
            echo "  \"image\": \"$IMG:$VER\","
            echo "  \"jar\": \"sandbox.jar\","
            echo "  \"binaries\": {"
            echo "    \"windows-amd64\": \"tsunagu-windows-amd64.exe\","
            echo "    \"darwin-amd64\": \"tsunagu-darwin-amd64\","
            echo "    \"darwin-arm64\": \"tsunagu-darwin-arm64\","
            echo "    \"linux-amd64\": \"tsunagu-linux-amd64\""
            echo "  },"
            echo "  \"runtimes\": {"
            echo "    \"windows-amd64\": \"runtime-windows-amd64.zip\","
            echo "    \"darwin-amd64\": \"runtime-darwin-amd64.tar.gz\","
            echo "    \"darwin-arm64\": \"runtime-darwin-arm64.tar.gz\","
            echo "    \"linux-amd64\": \"runtime-linux-amd64.tar.gz\""
            echo "  },"
            echo "  \"bundles\": {"
            echo "    \"windows-amd64\": \"tsunagu-windows-amd64.zip\","
            echo "    \"darwin-amd64\": \"tsunagu-darwin-amd64.tar.gz\","
            echo "    \"darwin-arm64\": \"tsunagu-darwin-arm64.tar.gz\","
            echo "    \"linux-amd64\": \"tsunagu-linux-amd64.tar.gz\""
            echo "  }"
            echo "}"
          } > manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Tsunagu v${{ inputs.version }}
          files: rel/*
          generate_release_notes: true
