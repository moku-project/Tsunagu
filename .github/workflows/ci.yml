name: ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'sandbox/**'
      - 'proto/**'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths:
      - 'backend/**'
      - 'sandbox/**'
      - 'proto/**'
      - 'flake.nix'
      - 'flake.lock'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: build / vet / test
        run: |
          nix develop -c bash -c '
            cd backend
            go build ./...
            go vet ./...
            go test ./...
          '
      - name: cross-compile
        run: |
          nix develop -c bash -c '
            cd backend
            for t in windows/amd64 darwin/amd64 darwin/arm64 linux/amd64; do
              GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/server
            done
          '

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: gradle test
        run: nix develop -c bash -c 'cd sandbox && gradle test --no-daemon'
