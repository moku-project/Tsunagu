name: ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'sandbox/**'
      - 'proto/**'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths:
      - 'backend/**'
      - 'sandbox/**'
      - 'proto/**'
      - 'flake.nix'
      - 'flake.lock'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: build / vet / test
        run: |
          nix develop -c bash -c '
            cd backend
            go build ./...
            go vet ./...
            go test ./...
          '
      - name: cross-compile
        run: |
          nix develop -c bash -c '
            cd backend
            for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
              GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/server
            done
          '

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Maven Central rate-limits fresh runners (429), so keep downloads between runs and back off on retries.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('sandbox/*.gradle.kts') }}
          restore-keys: gradle-
      - name: gradle test
        run: nix develop -c bash -c 'cd sandbox && gradle test --no-daemon -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=2000'
